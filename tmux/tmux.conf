# GENERAL SETTINGS:

# Free the original binding and set it to Ctrl-A instead.
unbind C-b
set -g prefix C-a

# Ensure we send Ctrl-A to other apps.
bind C-a send-prefix


# Set starting index for windows to 1.
set -g base-index 1

# Set starting index for panes to 1,
setw -g pane-base-index 1


# Gotta have my rainbows and unicorns.
set -as terminal-features ",xterm*:RGB"


# Set scrollbar history to 10k.
set -g history-limit 10000


# Set ESC & ALT disambiguation timeout to 1ms.
# The default half a second makes Vim painful.
set-option -sg escape-time 1


# Navigate using Vim style keys.
set -g mode-keys vi


# Notify me of activities in other windows.
set-window-option -g monitor-activity on
set-window-option -g visual-activity on
set-window-option -g visual-bell off


# Automatically set window title.
set -g set-titles on

set-option -g focus-events on


# Run new windows in fish if available, otherwise the login shell.
# default-shell stays as /bin/sh so popups, run-shell, and #() format
# expansion skip fish's ~500ms config-load cost on every invocation.
# `-l` preserves login semantics (e.g. /etc/paths via path_helper on macOS).
# Keeps this config portable across Bluefin, macOS, WSL, Arch, Ubuntu, etc.
# run-shell is used because tmux.conf does not expand $(...) on its own.
set -g default-shell /bin/sh
run-shell 'tmux set-option -g default-command "$(command -v fish || echo "$SHELL") -l"'



# WINDOW SETTINGS:

# Switch to the last active window.
unbind b
bind b last-window

# Open a new window in the current panes directory.
bind c new-window -c "#{pane_current_path}"

# Fuzzy-find and switch to a window by name.
bind f display-popup -E "tmux list-windows | sed 's/ [[].*//' | fzf --reverse | cut -d: -f1 | xargs tmux select-window -t"



# PANE SETTINGS:

# Easy to remember split pane commands that open in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

unbind '"'
unbind %

# Cycle preset layouts. Restores `next-layout`, since Space now enters copy-mode.
bind '\' next-layout


# Use Vim style keys to move between panes.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

unbind Up
unbind Down
unbind Left
unbind Right


# Pane resizing.
bind -r H resize-pane -L 1
bind -r J resize-pane -D 1
bind -r K resize-pane -U 1
bind -r L resize-pane -R 1


# Toggle zoom for the current pane.
bind m resize-pane -Z


# Quickly cycle through panes.
bind -r a select-pane -t :.+

# Kill the current pane without confirming
bind-key x kill-pane

# Launch a new window with the cheat.sh shell
bind ` neww fish -c 'cht.sh --shell'

# Toggle the status bar
bind z set-option status

# Toggle the status bar's side sections to widen the centred window list.
bind Z if -F '#{@status-sides}' 'set @status-sides 0' 'set @status-sides 1'

# Fullscreen clock popup. Replaces the built-in `clock-mode` (default <prefix> t),
# which dismisses on terminal focus-out and so vanishes when switching apps.
# Requires `clock-rs` (brew install clock-rs).
bind t display-popup -E -B -w 100% -h 100% "clock-rs --bold --color '#a9b1d6' --fmt '%A, %B %-d'"



# COPY MODE SETTINGS:

# Enter copy-mode with `Space`. Overrides the default `next-layout` binding.
unbind Space
bind Space copy-mode
unbind '['

# Enter copy-mode and scroll up one page in a single press.
bind C-u copy-mode -u

# Sync copy-mode yank to the system clipboard.
# Picks wl-copy (Wayland), pbcopy (macOS), clip.exe (WSL), falls back to xclip (X11).
# OSC 52 is avoided because Ptyxis (Bluefin's default terminal) does not support it.
# Keeps this config portable across Bluefin, macOS, Windows Terminal, etc.
# run-shell is used because tmux.conf does not expand $(...) on its own.
run-shell 'tmux set-option -s copy-command "$(command -v wl-copy || command -v pbcopy || command -v clip.exe || echo xclip -selection clipboard -in)"'

# Bind `y` to yank, matching Vim muscle memory. tmux's copy-mode-vi table
# ships without a default `y` binding, so Enter is otherwise the only yank key.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Match Vim's visual-mode keys: `v` starts a selection, `C-v` toggles block mode.
# By default tmux uses Space to begin-selection and `v` to rectangle-toggle.
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle


# STATUS BAR SETTINGS:

# Resolve the directory this config lives in, so status scripts (e.g. battery.sh)
# can be referenced by #{@dotfiles-dir}/name.sh without needing extra symlinks.
# Falls back to the config's own dir when tmux.conf is a plain file, not a symlink.
run-shell 'tmux set-option -g @dotfiles-dir "$(dirname "$(readlink ~/.config/tmux/tmux.conf || echo ~/.config/tmux/tmux.conf)")"'

set -g status-position top
set -g status-bg '#16161e'
set -g status-fg '#a9b1d6'

set -g clock-mode-colour white

set-window-option -g status-justify absolute-centre
set-window-option -g renumber-windows on

# Side sections are stored separately so `<prefix> Z` can hide them via @status-sides.
set -g @status-sides 1
set -g @status-left-content "#[bg=#2d323c,fg=#5a6371] 💼 #S #[bg=#16161e,fg=#2d323c]▓▒░"

set-window-option -g status-left-length 30
set-window-option -g status-left "#{E:#{?@status-sides,#{@status-left-content},}}"

#set-window-option -g window-status-separator " "
set-window-option -g window-status-activity-style bg=#2d323c
set-window-option -g window-status-format " #[fg=#5a6371]#I │ #W "
set-window-option -g window-status-current-format "#[fg=#d373e3]░▒▓#[fg=#272c34,bg=#d373e3] #I │ #W #[fg=#d373e3,bg=default]▓▒░"

set -g @status-right-content ' #[fg=#2d323c]░▒▓#[bg=#2d323c,fg=#5a6371] #H #[fg=#3d424b]│ #(#{@dotfiles-dir}/battery.sh)#[fg=#5a6371]%H:%M '
set -g status-right "#{E:#{?@status-sides,#{@status-right-content},}}"



# HELPERS:

# Use 1-based shortcut keys in the `<prefix> s` session list:
# line 0 → "1", line 8 → "9", line 9+ → "a"-"z".
bind s choose-tree -Zs -K "#{?#{e|<:#{line},9},#{e|+:#{line},1},#{a:#{e|+:97,#{e|-:#{line},9}}}}"

# Find & switch between active sessions.
# Similar to `<prefix> s`, which shows a list of sessions instead.
unbind S
bind S command-prompt "switch -t %1"

# Toggle between the current and last session, like `<prefix> b` does for windows.
bind Tab switch-client -l


# This really comes in handy when playing around with your tmux.conf file.
bind r source-file ~/.config/tmux/tmux.conf \; display 'Reloaded!'


# Log output to a text file on demand.
bind T pipe-pane -o "cat >>~/#W.log" \; display "Toggled logging to ~/#W.log"


# Not sure how I feel about this but I'll leave it on for a while and see how it goes
set -g mouse on


# PLUGINS:
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


# Notes
#
# Use `tmux show-options -g` to see current active options
#
# The man pages were great in finding all the different settigns and their options
# https://www.man7.org/linux/man-pages/man1/tmux.1.html
